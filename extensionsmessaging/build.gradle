plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def VERSION = "1.0.0"

android {
    namespace "com.google.androidbrowserhelper.extensions.messaging"
    compileSdk 36

    defaultConfig {
        minSdkVersion 29

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation libs.androidx.annotation

    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
}

afterEvaluate {
    publishing {
        publications {
            Production(MavenPublication) {
                from components.release

                groupId = 'com.google.androidbrowserhelper'
                artifactId = 'extensionsmessaging'
                version = VERSION

                pom {
                    name = 'android-browser-helper-extensionsmessaging'
                    url = 'https://github.com/GoogleChrome/android-browser-helper/tree/main/extensionsmessaging'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
    }
}
